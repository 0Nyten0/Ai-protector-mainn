<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            background-color: #0d0e15;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            padding: 0;
            margin: 0;
        }
        .container {
            padding: 20px;
            border: 1px solid #ff007f;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        h3 {
            margin: 0;
            color: #00f0ff;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-box {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .indicator {
            width: 12px;
            height: 12px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse 2s infinite;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
        }
        .stat-item strong {
            color: #fff;
            display: block;
            font-size: 14px;
            margin-bottom: 2px;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h3>🛡️ AI Protector</h3>
            <span style="font-size: 12px; color: #666;">v1.0</span>
        </header>
        
        <div class="status-box">
            <div class="indicator"></div>
            <div>
                <div style="font-weight: bold; color: #00ff00;">ЗАЩИТА АКТИВНА</div>
                <div style="font-size: 11px; color: #aaa;">Мониторинг биометрии...</div>
            </div>
        </div>

        <div style="font-size: 13px; line-height: 1.4; color: #ddd;">
            Нейросеть анализирует поведение мыши и кликов для предотвращения тильта.
        </div>

        <div class="stats">
            <div class="stat-item">
                <strong>Local ML</strong>
                <span>Random Forest</span>
            </div>
            <div class="stat-item">
                <strong>LLM Engine</strong>
                <span>Ollama (Qwen)</span>
            </div>
        </div>
    </div>
</body>
</html>
